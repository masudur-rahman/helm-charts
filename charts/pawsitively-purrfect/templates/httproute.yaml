{{- if .Values.httproute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "pawsitively-purrfect.fullname" . }}
  labels:
    {{- include "pawsitively-purrfect.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httproute.parentRef.name }}
      namespace: {{ .Values.httproute.parentRef.namespace }}
  hostnames:
    {{- range .Values.httproute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "pawsitively-purrfect.fullname" . }}
          port: {{ .Values.httproute.port }}
{{- end }}
