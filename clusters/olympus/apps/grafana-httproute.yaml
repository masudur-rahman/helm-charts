apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: olympus
      namespace: gateway
  hostnames:
    - grafana.mrahman.xyz
  rules:
    - backendRefs:
        # Service name follows the kube-prometheus-stack release name; verify.
        - name: kube-prometheus-stack-grafana
          port: 80
