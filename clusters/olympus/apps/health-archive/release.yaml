# health-archive chart from the dev-stack GitRepository. Values (incl. image
# tags) live in values.yaml next to this file.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: health-archive
  namespace: flux-system
spec:
  interval: 10m
  releaseName: health-archive
  targetNamespace: health-archive
  storageNamespace: health-archive
  chart:
    spec:
      chart: ./charts/health-archive
      # Chart edits on the tracked ref roll out without a version bump.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: health-archive-devstack
        namespace: flux-system
      interval: 10m
  # medipedia imports its seed on first start (several minutes).
  timeout: 20m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: health-archive-values
      valuesKey: values.yaml
