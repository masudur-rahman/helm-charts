apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# health-archive (medjournal). Chart from the private health-archive/dev-stack
# repo; Secrets are created by homelab-forge (`make health_archive`) from its
# vault, since the Postgres/MinIO creds are shared with data-01.
resources:
  - namespace.yaml
  - source.yaml
  - release.yaml
configMapGenerator:
  # values.yaml → ConfigMap the HelmRelease reads. Stable name + watch label so
  # an edit to values.yaml upgrades the release on the next reconcile.
  - name: health-archive-values
    namespace: flux-system
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
