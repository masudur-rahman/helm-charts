apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cloudflare
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: masudjuly02@gmail.com
    privateKeySecretRef:
      name: letsencrypt-cloudflare-account
    solvers:
      # DNS-01 via cert-manager's built-in Cloudflare solver (no webhook).
      # Token scope: Zone > DNS > Edit on mrahman.xyz only.
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
