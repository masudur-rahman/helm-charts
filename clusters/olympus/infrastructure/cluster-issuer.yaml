apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-porkbun
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: masudjuly02@gmail.com
    privateKeySecretRef:
      name: letsencrypt-porkbun-account
    solvers:
      # DNS-01 via the Talinx Porkbun cert-manager webhook (installed by Ansible).
      # groupName/solverName must match the deployed webhook chart.
      - dns01:
          webhook:
            groupName: porkbun.talinx.dev
            solverName: porkbun
            config:
              apiKey:
                name: porkbun-credentials
                key: api-key
              secretApiKey:
                name: porkbun-credentials
                key: secret-key
