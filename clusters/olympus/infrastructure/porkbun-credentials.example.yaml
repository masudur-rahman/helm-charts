# Template — copy to porkbun-credentials.sops.yaml, fill real values, then sops-encrypt.
# Values currently live in homelab-forge vault/compute.yml
# (vault_porkbun_api_key / vault_porkbun_secret_key).
apiVersion: v1
kind: Secret
metadata:
  name: porkbun-credentials
  namespace: cert-manager
type: Opaque
stringData:
  api-key: "REPLACE_WITH_PORKBUN_API_KEY"
  secret-key: "REPLACE_WITH_PORKBUN_SECRET_KEY"
