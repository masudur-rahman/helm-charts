apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-mrahman-xyz
  namespace: gateway
spec:
  secretName: wildcard-mrahman-xyz-tls
  issuerRef:
    name: letsencrypt-porkbun
    kind: ClusterIssuer
  commonName: "*.mrahman.xyz"
  dnsNames:
    - "mrahman.xyz"
    - "*.mrahman.xyz"
